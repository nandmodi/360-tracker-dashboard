<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360 Delivery Report — Last 3 Months</title>
<style>
  :root{
    --pri:#7c3aed; --pri-d:#5b21b6; --pri-l:#a78bfa;
    --bg:#f4f3ff; --card:#ffffff; --ink:#1e1b2e; --muted:#6b6785;
    --line:#e7e3fb; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --img:#2563eb; --vid:#db2777;
    --shadow:0 1px 2px rgba(60,40,120,.06), 0 8px 24px rgba(90,50,180,.08);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17151f; --card:#211d2e; --ink:#f2efff; --muted:#a49dc0;
      --line:#332c47; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{ --bg:#17151f; --card:#211d2e; --ink:#f2efff; --muted:#a49dc0; --line:#332c47; }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:var(--pri);text-decoration:none}
  .wrap{max-width:none;margin:0;padding:0 24px 48px}
  .hero{background:linear-gradient(135deg,var(--pri) 0%,var(--pri-d) 100%);color:#fff;border-radius:0 0 22px 22px;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 24px 26px;box-shadow:var(--shadow);margin-bottom:20px;}
  .hero .in{max-width:none;margin:0}
  .hero h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
  .hero p{margin:4px 0 0;opacity:.85;font-size:12.5px}
  .hero .strip{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
  .hero .strip div{font-size:12px;opacity:.9}
  .hero .strip b{display:block;font-size:18px;font-weight:700;opacity:1}
  body.slim .hero{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:12px;border-radius:0 0 14px 14px;margin-bottom:14px}
  body.slim .hero h1{font-size:16px}
  body.slim .hero p,body.slim .hero .strip{display:none}
  .crumb{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .crumb button{background:none;border:none;color:var(--pri);font:inherit;cursor:pointer;padding:0}
  .crumb .sep{opacity:.5}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .split{grid-template-columns:1fr}
  @media(min-width:620px){.split{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;border-top:3px solid var(--pri);position:relative;overflow:hidden}
  .card.b-green{border-top-color:var(--green)} .card.b-amber{border-top-color:var(--amber)}
  .card.b-img{border-top-color:var(--img)} .card.b-vid{border-top-color:var(--vid)}
  .card h3{margin:0;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .card .big{font-size:26px;font-weight:800;margin:6px 0 2px}
  .emoji{font-size:15px}
  .months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .months .m{background:var(--bg);border-radius:9px;padding:7px 4px;text-align:center}
  .months .m .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .months .m .val{font-size:14px;font-weight:700;margin-top:2px}
  .months .m.cur{outline:2px solid var(--pri-l);outline-offset:-2px}
  .delta{font-size:11px;font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .clk{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
  .clk:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(90,50,180,.16)}
  .clk .hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--pri);font-weight:600}
  .bar{height:8px;border-radius:999px;background:var(--line);margin-top:12px;overflow:hidden}
  .bar span{display:block;height:100%}
  .tblcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border-top:3px solid var(--pri)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--bg);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .ent-row td{font-weight:700;background:color-mix(in srgb,var(--pri) 6%,var(--card))}
  .ent-row{cursor:pointer} .ent-row:hover td{background:color-mix(in srgb,var(--pri) 12%,var(--card))}
  .cx{display:inline-block;width:1.1em;color:var(--pri);font-size:11px}
  .tid{font-size:11px;color:var(--muted)}
  .cnt-btn{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:5px 12px;font:inherit;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
  .cnt-btn:hover{background:var(--pri-d)}
  .tblscroll{overflow-x:auto}
  .bkctl{display:flex;gap:10px;align-items:center;margin:0 4px 12px}
  .bkctl button{background:var(--card);border:1px solid var(--line);color:var(--pri);font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:5px 12px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:820px){.cards{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
  .vcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .vcard .top{display:flex;justify-content:space-between;align-items:center;padding:6px 11px;border-bottom:1px solid var(--line);gap:8px}
  .vin{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;word-break:break-all}
  .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px;white-space:nowrap;flex:0 0 auto}
  .p-del{background:#dcfce7;color:#166534} .p-rej{background:#fee2e2;color:#991b1b}
  .p-pen{background:#fef3c7;color:#92400e} .p-oth{background:#e5e7eb;color:#374151}
  .spin{position:relative;aspect-ratio:16/9;background:radial-gradient(120% 90% at 50% 30%,#4b4660 0%,#232030 70%);
    display:flex;align-items:center;justify-content:center;color:#cfc9e6;overflow:hidden}
  .spin iframe{width:100%;height:100%;border:0;display:block}
  .spin .floor{position:absolute;bottom:12%;left:12%;right:12%;height:16%;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.14),transparent 70%)}
  .spin .load{position:relative;z-index:2;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
  .spin .badge{position:absolute;top:8px;right:8px;background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;z-index:2}
  .vfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);gap:8px}
  .vfoot .sk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{background:color-mix(in srgb,var(--pri) 7%,var(--card));border:1px dashed var(--pri-l);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);margin-bottom:16px}
  .note b{color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;margin:22px 4px 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .center{text-align:center;padding:60px 20px;color:var(--muted)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:16px;font-size:13px}
  .more{display:block;margin:18px auto 0;background:var(--card);border:1px solid var(--line);color:var(--pri);font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0;font-size:12.5px;color:var(--muted)}
  .pager button{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer}
  .pager button:disabled{background:var(--line);color:var(--muted);cursor:default}
  .spin .cap{position:relative;z-index:2;font-size:12px;opacity:.85;text-align:center;padding:0 10px}
  .dfilter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  .dfilter input[type=date]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  .dfilter button{background:var(--card);border:1px solid var(--line);color:var(--pri);font:inherit;font-weight:600;border-radius:8px;padding:5px 12px;cursor:pointer}
</style>
</head>
<body>
  <div class="hero"><div class="in">
    <h1>📊 360 Delivery Report</h1>
    <p id="sub">Last 3 months · loading…</p>
    <div class="strip" id="strip"></div>
  </div></div>
  <div class="wrap">
    <div class="crumb" id="crumb"></div>
    <div id="view"><div class="center"><div class="spinner"></div>Loading live data…</div></div>
  </div>

<script>
/* ============================================================
   360 Delivery Report — LIVE data
   Source: /data/index.json  ->  /data/<YYYY-MM>.json  { rows:[...] }
   Same logic as the 360 tracker:
     isDelivered   : fs === 'Delivered'
     isPending     : cs in (qc_unassigned, qc_inprogress)
     Avg TAT       : mean of r.tat (sku_created_on -> first_qc_done) over TAT-eligible rows
     Fulfilment %  : delivered / max(received - pending, 1) * 100
     Image/Video % : split by input_type (tt): Images -> image, Video -> video
   Page-3 spin per your SQL: mediaId(vid) -> v3 spin, else sku_id fallback
   Window: current + previous 3 months (4 total), everywhere.
   ============================================================ */
const DATA_BASE = '/data';                 // absolute — works from /data-review/
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const isDelivered = r => (r.fs||'').trim() === 'Delivered';
const isPending   = r => { const c=(r.cs||'').trim(); return c==='qc_unassigned'||c==='qc_inprogress'; };
const TAT_ELIG = new Set(['Delivered','QC Failed','Validation Failed','Tech Failure','AI Failed','Undelivered']);
const isTatEligible = r => TAT_ELIG.has((r.fs||'').trim());
const teamId   = r => r.tid || r.tm || '—';
const inputType= r => (r.tt||'').trim();
const ttClass  = r => { const t=(r.tt||'').trim().toLowerCase();   // "Images"/"Image" -> image, "Video" -> video
  if(t.indexOf('image')===0) return 'image'; if(t.indexOf('video')===0) return 'video'; return null; };

function avgTat(rows){
  // TAT measured from sku_created_on -> first_qc_done  (r.tat), per request.
  let s=0,n=0;
  for(const r of rows){ if(!isTatEligible(r)) continue;
    if(typeof r.tat==='number' && isFinite(r.tat) && r.tat>=0){ s+=r.tat; n++; } }
  return n ? s/n : null;
}
function fulfil(rows){
  let rec=rows.length, pend=0, del=0;
  for(const r of rows){ if(isPending(r)) pend++; if(isDelivered(r)) del++; }
  return rec ? (del/Math.max(rec-pend,1))*100 : null;
}
function buildSpinUrl(r){
  if(r.vid && r.vid!=='') return 'https://assets.spyne.ai/360?version=v3&mediaId='+encodeURIComponent(r.vid)+'&spin=1';
  return 'https://assets.spyne.ai/360?sku_id='+encodeURIComponent(r.sku||'')+'&input=true';
}
function statusPill(r){
  const s=(r.fs||'').trim();
  if(s==='Delivered') return ['Delivered','p-del'];
  if(s==='QC Failed'||s==='Validation Failed') return [s,'p-rej'];
  if(isPending(r)) return ['Pending','p-pen'];
  return [s||'—','p-oth'];
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mlabel = mk => { const [y,m]=mk.split('-'); return MONTH_NAMES[(+m)-1]+' '+y.slice(2); };
const nfmt = n => (n==null?'—':n.toLocaleString());

/* ---- state ---- */
let MONTHS=[];        // current + prev 3 (4 total), oldest -> newest
let byMonth={};       // mk -> rows[]
let ALL=[];           // all 4 months merged
const state={screen:'overview', input:null, ent:null, tid:null, tm:null, shown:0, page:0, from:'', to:''};
const $=id=>document.getElementById(id);

async function boot(){
  try{
    const idx = await fetch(DATA_BASE+'/index.json?t='+Date.now()).then(r=>{ if(!r.ok) throw new Error('index.json '+r.status); return r.json(); });
    const desc = [...(idx.months||[])].sort().reverse();
    MONTHS = desc.slice(0,4).reverse();               // current + previous 3, oldest->newest
    const cb = Date.now();
    const res = await Promise.all(MONTHS.map(mk =>
      fetch(`${DATA_BASE}/${mk}.json?t=${cb}`).then(r=>{ if(!r.ok) throw new Error(mk+'.json '+r.status); return r.json(); })));
    MONTHS.forEach((mk,i)=>{ byMonth[mk] = (res[i]&&res[i].rows)||[]; });
    ALL = []; MONTHS.forEach(mk=> ALL.push(...byMonth[mk]));
    $('sub').textContent = `${mlabel(MONTHS[0])} – ${mlabel(MONTHS[MONTHS.length-1])} · ${nfmt(ALL.length)} SKUs · synced ${idx.lastSynced?new Date(idx.lastSynced).toLocaleString():'—'}`;
    const del = ALL.filter(isDelivered).length;
    $('strip').innerHTML =
      `<div><b>${nfmt(ALL.length)}</b>Total SKUs</div>`+
      `<div><b>${(fulfil(ALL)||0).toFixed(1)}%</b>Fulfilment</div>`+
      `<div><b>${(avgTat(ALL)||0).toFixed(1)} h</b>Avg TAT</div>`+
      `<div><b>${nfmt(del)}</b>Delivered</div>`;
    render();
  }catch(e){
    $('view').innerHTML = '<div class="err"><b>Failed to load data.</b><br>'+esc(e.message)+
      '<br><br>Check that <code>/data/index.json</code> and the monthly files are reachable from this page.</div>';
    $('sub').textContent = 'Last 3 months';
  }
}

/* ---- routing ---- */
let BK=[];   // breakdown button registry: index -> {ent,tid,tm}
function openCards(i){ const b=BK[i]; if(b) go('cards',{ent:b.ent,tid:b.tid,tm:b.tm,page:0}); }
function go(s,patch={}){ Object.assign(state,{screen:s},patch); if(s!=='cards') state.shown=0; render(); window.scrollTo(0,0); }
function crumb(){
  const p=[`<button onclick="go('overview')">Overview</button>`];
  if(state.screen!=='overview')
    p.push(`<span class="sep">›</span><button onclick="go('breakdown',{input:'${state.input}'})">${state.input==='image'?'Image input':'Video input'}</button>`);
  if(state.screen==='cards')
    p.push(`<span class="sep">›</span><span>${esc(state.ent)} · ${esc(state.tm)}</span>`);
  $('crumb').innerHTML = p.join('');
}

/* ---- screen 1: overview ---- */
function overview(){
  const tat = MONTHS.map(mk=>avgTat(byMonth[mk]));
  const ful = MONTHS.map(mk=>fulfil(byMonth[mk]));
  const entCount = new Set(ALL.filter(r=>r.ent).map(r=>r.ent)).size;
  const teamCount= new Set(ALL.map(teamId)).size;
  let img=0,vid=0; for(const r of ALL){ const c=ttClass(r); if(c==='image')img++; else if(c==='video')vid++; }
  const iv = img+vid || 1;
  const imgPct = img/iv*100, vidPct = vid/iv*100;
  const ivM = MONTHS.map(mk=>{ let a=0,b=0; for(const r of byMonth[mk]){ const c=ttClass(r); if(c==='image')a++; else if(c==='video')b++; } return {img:a,vid:b}; });
  const imgArr = ivM.map(m=> (m.img+m.vid)? m.img/(m.img+m.vid)*100 : null);
  const vidArr = ivM.map(m=> (m.img+m.vid)? m.vid/(m.img+m.vid)*100 : null);
  const last = MONTHS.length-1;

  const dtat = (tat[last]!=null&&tat[last-1]!=null)?(tat[last]-tat[last-1]):null;   // lower better
  const dful = (ful[last]!=null&&ful[last-1]!=null)?(ful[last]-ful[last-1]):null;   // higher better
  const arrow=(d,lowerBetter)=>{ if(d==null||Math.abs(d)<0.05) return `<span class="delta flat">–</span>`;
    const good = lowerBetter? d<0 : d>0; return `<span class="delta ${good?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}${lowerBetter?'h':'%'}</span>`; };
  const cells=(arr,unit)=>MONTHS.map((mk,i)=>`<div class="m ${i===last?'cur':''}"><div class="lbl">${mlabel(mk)}</div><div class="val">${arr[i]==null?'—':arr[i].toFixed(1)+unit}</div></div>`).join('');

  return `
  <div class="grid kpis">
    <div class="card">
      <h3><span class="emoji">⏱️</span> Avg TAT</h3>
      <div class="big">${tat[last]==null?'—':tat[last].toFixed(1)+' h'} ${arrow(dtat,true)}</div>
      <div class="months">${cells(tat,' h')}</div>
    </div>
    <div class="card b-green">
      <h3><span class="emoji">✅</span> Fulfilment %</h3>
      <div class="big">${ful[last]==null?'—':ful[last].toFixed(1)+'%'} ${arrow(dful,false)}</div>
      <div class="months">${cells(ful,'%')}</div>
    </div>
    <div class="card b-amber">
      <h3><span class="emoji">🏢</span> Enterprise Count</h3>
      <div class="big">${nfmt(entCount)}</div>
      <div style="font-size:12px;color:var(--muted)">Distinct enterprises · last 3 months</div>
    </div>
    <div class="card b-amber">
      <h3><span class="emoji">👥</span> Team Count</h3>
      <div class="big">${nfmt(teamCount)}</div>
      <div style="font-size:12px;color:var(--muted)">Distinct team IDs · last 3 months</div>
    </div>
  </div>

  <div class="sec-title">Input type split — click to drill down</div>
  <div class="grid split">
    <div class="card b-img clk" onclick="go('breakdown',{input:'image'})">
      <h3><span class="emoji">🖼️</span> Image %</h3>
      <div class="big">${imgArr[last]==null?'—':imgArr[last].toFixed(1)+'%'}</div>
      <div style="font-size:12px;color:var(--muted)">${nfmt(img)} image-input SKUs · 4-mo total → drill down</div>
      <div class="months">${cells(imgArr,'%')}</div>
    </div>
    <div class="card b-vid clk" onclick="go('breakdown',{input:'video'})">
      <h3><span class="emoji">🎬</span> Video %</h3>
      <div class="big">${vidArr[last]==null?'—':vidArr[last].toFixed(1)+'%'}</div>
      <div style="font-size:12px;color:var(--muted)">${nfmt(vid)} video / walkaround SKUs · 4-mo total → drill down</div>
      <div class="months">${cells(vidArr,'%')}</div>
    </div>
  </div>`;
}

/* ---- screen 2: breakdown (collapsible) ---- */
function rowsForInput(){ return ALL.filter(r=>ttClass(r)===state.input); }
function toggleEnt(ei){
  const rows=document.querySelectorAll('.e'+ei);
  if(!rows.length) return;
  const show = rows[0].style.display==='none';
  rows.forEach(tr=> tr.style.display = show?'':'none');
  const cx=document.getElementById('cx'+ei); if(cx) cx.textContent = show?'▾':'▸';
}
function setAllEnt(open){
  document.querySelectorAll('#bktbody tr.team').forEach(tr=> tr.style.display = open?'':'none');
  document.querySelectorAll('#bktbody .cx').forEach(cx=> cx.textContent = open?'▾':'▸');
}
function breakdown(){
  const rows = rowsForInput();
  const ents={};
  for(const r of rows){
    const e=r.ent||'—'; const tid=teamId(r);
    (ents[e]=ents[e]||{})[tid] = ents[e][tid] || {tm:r.tm||tid, cnt:0, del:0};
    ents[e][tid].cnt++; if(isDelivered(r)) ents[e][tid].del++;
  }
  const entNames = Object.keys(ents).sort((a,b)=>{
    const sa=Object.values(ents[a]).reduce((x,t)=>x+t.cnt,0), sb=Object.values(ents[b]).reduce((x,t)=>x+t.cnt,0);
    return sb-sa;
  });
  BK=[];
  let body='';
  entNames.forEach((e,ei)=>{
    const teams=Object.entries(ents[e]).sort((a,b)=>b[1].cnt-a[1].cnt);
    const et=teams.reduce((x,[,t])=>x+t.cnt,0), ed=teams.reduce((x,[,t])=>x+t.del,0);
    body+=`<tr class="ent-row" onclick="toggleEnt(${ei})">
      <td><span class="cx" id="cx${ei}">▸</span>${esc(e)} <span class="tid">(${teams.length} team${teams.length>1?'s':''})</span></td>
      <td></td><td class="num">${nfmt(et)}</td><td class="num">${nfmt(ed)}</td></tr>`;
    for(const [tid,t] of teams){
      const bi=BK.push({ent:e,tid,tm:t.tm})-1;
      body+=`<tr class="team e${ei}" style="display:none">
        <td style="padding-left:26px">↳</td>
        <td>${esc(t.tm)} <span class="tid">tid ${esc(tid)}</span></td>
        <td class="num"><button class="cnt-btn" onclick="event.stopPropagation();openCards(${bi})">${nfmt(t.cnt)}</button></td>
        <td class="num">${nfmt(t.del)}</td>
      </tr>`;
    }
  });
  if(!entNames.length) body=`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">No ${state.input} SKUs in this window.</td></tr>`;
  return `
  <div class="note">Enterprises &amp; teams for <b>${state.input==='image'?'Image input':'Video input'}</b> · totals are last 3 months · click an <b>enterprise row</b> to expand its teams, then a <b>Count</b> to see the SKUs.</div>
  <div class="bkctl"><span style="color:var(--muted)">${entNames.length} enterprises</span>
    <button onclick="setAllEnt(true)">Expand all</button>
    <button onclick="setAllEnt(false)">Collapse all</button></div>
  <div class="tblcard"><div class="tblscroll"><table>
    <thead><tr><th>Enterprise</th><th>Team (unique tid)</th><th class="num">Total Count</th><th class="num">Total Delivered</th></tr></thead>
    <tbody id="bktbody">${body}</tbody>
  </table></div></div>`;
}

/* ---- screen 3: cards ---- */
const PER_PAGE=8;
function cardRows(){
  let rows = rowsForInput().filter(r=> teamId(r)===state.tid && (r.ent||'—')===state.ent);
  if(state.from) rows = rows.filter(r=> (r.c||'').slice(0,10) >= state.from);
  if(state.to)   rows = rows.filter(r=> (r.c||'').slice(0,10) <= state.to);
  return rows.sort((a,b)=> String(b.c||b.sc||'').localeCompare(String(a.c||a.sc||'')));   // newest first
}
function spinHTML(r){
  const url=buildSpinUrl(r);
  if(isDelivered(r))
    return `<div class="spin"><span class="badge">360°</span><iframe loading="lazy" src="${url}" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`;
  return `<div class="spin nos"><div class="floor"></div><span class="cap">No 360 · ${esc(statusPill(r)[0])}</span></div>`;
}
function cards(){
  const rows=cardRows();
  const total=rows.length;
  const pages=Math.max(1, Math.ceil(total/PER_PAGE));
  let pg=state.page||0; if(pg>=pages) pg=pages-1; if(pg<0) pg=0; state.page=pg;
  const slice=rows.slice(pg*PER_PAGE, pg*PER_PAGE+PER_PAGE);
  const html=slice.map(r=>{
    const [lbl,cls]=statusPill(r); const delivered=isDelivered(r); const url=buildSpinUrl(r);
    const foot = delivered
      ? `<div class="vfoot"><span class="sk">sku ${esc(r.sku||'—')}</span><a href="${url}" target="_blank" rel="noopener">Open 360 ↗</a></div>`
      : `<div class="vfoot"><span class="sk">sku ${esc(r.sku||'—')}</span><span style="opacity:.55">no 360</span></div>`;
    return `<div class="vcard">
      <div class="top"><span class="vin">${esc(r.vin||r.sku||'—')}</span><span class="pill ${cls}">${esc(lbl)}</span></div>
      ${spinHTML(r)}${foot}
    </div>`;
  }).join('');
  const flt=`<div class="dfilter">
    <span>📅 Date range (optional)</span>
    <label>From <input type="date" value="${state.from||''}" onchange="state.from=this.value;state.page=0;render();"></label>
    <label>To <input type="date" value="${state.to||''}" onchange="state.to=this.value;state.page=0;render();"></label>
    ${(state.from||state.to)?`<button onclick="state.from='';state.to='';state.page=0;render();">Clear</button>`:''}
  </div>`;
  const nav=`<div class="pager">
    <button ${pg<=0?'disabled':''} onclick="state.page=${pg-1};render();window.scrollTo(0,0);">← Prev</button>
    <span>Page ${pg+1} of ${pages} · ${nfmt(total)} SKUs</span>
    <button ${pg>=pages-1?'disabled':''} onclick="state.page=${pg+1};render();window.scrollTo(0,0);">Next →</button>
  </div>`;
  return `
  <div class="note"><b>${esc(state.ent)} · ${esc(state.tm)}</b> — ${nfmt(total)} ${state.input} SKUs${(state.from||state.to)?' (filtered)':''}, newest first. 360 spin auto-loads for <b>Delivered</b> only.</div>
  ${flt}
  <div class="cards">${html||'<div class="center">No SKUs in this range.</div>'}</div>
  ${total?nav:''}`;
}

function render(){
  document.body.classList.toggle('slim', state.screen!=='overview');
  crumb();
  $('view').innerHTML = state.screen==='overview'?overview()
                      : state.screen==='breakdown'?breakdown()
                      : cards();
}
boot();
</script>
</body>
</html>
