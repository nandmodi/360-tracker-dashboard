name: Sync Metabase data

on:
  workflow_dispatch:          # triggered by cron-job.org via API
  schedule:
    - cron: '0 * * * *'      # hourly fallback (in case cron-job.org misses)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch & process Metabase data
        run: node scripts/sync-data.js

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --staged --quiet && echo "No changes, skipping commit" || (
            git commit -m "chore: sync data $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          )
