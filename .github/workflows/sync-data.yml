name: Sync Metabase data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch & process Metabase data
        run: node scripts/sync-data.js
        env:
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/
          git diff --staged --quiet && echo "No changes, skipping commit" || (
            git commit -m "chore: sync data $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          )

      - name: Sync 360_spin / 360_region / 360_rt to Google Sheets
        continue-on-error: true  # dashboard sync above already succeeded; don't let a Sheets-side issue show as an overall failure
        run: node scripts/sync-sheets.js
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: '16vFElbOV8Awd63R6-WlsNdAScWNE18xGUPFkzE0GN7c'
